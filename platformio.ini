build_src_filter = +<tests/deep_sleep_test.cpp>

[env:test_peripheral_bus]
extends = base:esp32c6
build_src_filter = +<tests/peripheral_bus_test.cpp>

[env:test_watchdog]
extends = base:esp32c6
build_src_filter = +<tests/watchdog_test.cpp>

[env:low_power_sleep_test]
extends = base:c6_local_test
build_src_filter = +<tests/low_power_sleep_test.cpp>

[env:peripheral_bus_test]
extends = base:c6_local_test
build_src_filter = +<tests/peripheral_bus_test.cpp>

[env:watchdog_test]
