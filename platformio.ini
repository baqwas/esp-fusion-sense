; ============================================================================
; PlatformIO Project Configuration File
; Project: esp-fusion-sense
; Target Hardware: DFRobot FireBeetle 2 (ESP32-C6 / ESP32-S3)
;
; UPDATE HISTORY:
; - 2026-07-31: Added `fermion_c4002_test` environment and removed obsolete C4002 and ENS160 test references.
; - 2026-07-31: Added consolidated `fermion_ens160_test` environment and removed obsolete exercise files.
; - 2026-07-26: Fixed CI build failure for ESP32-C6 by enforcing the upstream
;               espressif32 Git repository for Arduino framework compatibility.
;               Cleaned up inheritance overrides in production environments.
; - 2026-07-24: Added dedicated test environments for sleep, watchdog, and DMA.
; - 2026-07-20: Initial commit: DFRobot Firebeetle setup and basic structure.
; ============================================================================

[platformio]
# default_envs = production_c6
default_envs = fermion_c4002_test_c6

; ----------------------------------------------------------------------------
; Base Configuration Profiles
; ----------------------------------------------------------------------------
; Note for students: Base environments define shared configurations.
; Do NOT redefine 'platform', 'board', or 'framework' in child environments
; unless you explicitly intend to override these base settings.

[base:esp32c6]
; Using the upstream development branch to ensure Arduino framework
; support for the ESP32-C6 architecture.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

[base:esp32s3]
platform = espressif32
board = dfrobot_firebeetle2_esp32s3
framework = arduino
monitor_speed = 115200

[base:c6_local_test]
extends = base:esp32c6
upload_protocol = esptool
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[base:sensor_libs]
lib_deps =
    dfrobot/DFRobot_C4002 @ ^1.0.0
    dfrobot/DFRobot_ENS160 @ ^1.0.0
    dfrobot/DFRobot_BME280 @ ^1.0.0

; ----------------------------------------------------------------------------
; Production Environments
; ----------------------------------------------------------------------------

[env:production_c6]
extends = base:esp32c6, base:sensor_libs
check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --suppress=unusedFunction
    --suppress=cstyleCast
    --suppress=noExplicitConstructor
    --suppress=missingOverride
build_flags =
    -D DEVICE_ID=\"${sysenv.WIFI_HOSTNAME_DEFAULT}\"
build_src_filter = +<main.cpp> -<tests/>
; Removed duplicate platform, board, and framework variables to preserve base inheritance
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L

[env:production_s3]
extends = base:esp32s3
build_src_filter = +<*> -<tests/>

; ----------------------------------------------------------------------------
; Isolated Hardware Validation Environments for Active Sensor Tests
; ----------------------------------------------------------------------------

[env:fermion_c4002_test_c6]
extends = base:c6_local_test
lib_deps = dfrobot/DFRobot_C4002 @ ^1.0.0
build_flags =
    -D DEVICE_ID=\"${sysenv.WIFI_HOSTNAME_DEFAULT}\"
build_src_filter = +<tests/fermion_c4002_test.cpp> -<main.cpp>

[env:bme280_test_c6]
extends = base:c6_local_test
lib_deps =
    dfrobot/DFRobot_BME280 @ ^1.0.0
build_src_filter = +<tests/bme280_test.cpp> -<main.cpp>

[env:fermion_ens160_test_c6]
extends = base:c6_local_test
lib_deps =
    dfrobot/DFRobot_ENS160 @ ^1.0.0
build_src_filter = +<tests/fermion_ens160_test.cpp> -<main.cpp>

; ----------------------------------------------------------------------------
; Local FreeRTOS & System Tests
; ----------------------------------------------------------------------------

[env:blink_test_c6]
extends = base:c6_local_test
build_src_filter = +<tests/blink_test.cpp> -<main.cpp>

[env:freertos_task_test_c6]
extends = base:c6_local_test
build_src_filter = +<tests/freertos_task_test.cpp> -<main.cpp>

[env:freertos_unified_test_c6]
extends = base:c6_local_test
build_src_filter = +<tests/freertos_unified_test.cpp> -<main.cpp>

[env:freertos_queue_test_c6]
