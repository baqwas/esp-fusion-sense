[env:dfrobot_firebeetle2_esp32c6]
platform = espressif32
board = dfrobot_firebeetle2_esp32c6
framework = arduino
monitor_speed = 115200

; Pass hardware/network identifiers at compile time
build_flags = 
    -D WIFI_HOSTNAME_DEFAULT=\"Firebeetle-01\"

lib_deps =
    dfrobot/DFRobot_C4002 @ ^1.0.0
    dfrobot/DFRobot_ENS160 @ ^1.0.1
    dfrobot/DFRobot_BME280 @ ^1.0.2
