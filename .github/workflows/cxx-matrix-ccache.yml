# ==============================================================================
# File: cxx-matrix-ccache.yml
# Workflow: C/C++ Build & Test Matrix with ccache
# Version: 1.0.0
# Last Updated: 2026-07-30
# Purpose: Compiles and tests a C/C++ project across Linux/macOS and GCC/Clang,
#          leveraging ccache to eliminate redundant compiler steps.
# Triggers:
#   - Pushes to main branch
#   - Pull requests targeting main branch
# ==============================================================================

name: C/C++ Matrix (ccache)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - '.github/workflows/cxx-matrix-ccache.yml' # Keep workflow changes monitored
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - '.github/workflows/cxx-matrix-ccache.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      # Step 1: Check out repository source code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Install Python (required for PlatformIO)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install the PlatformIO CLI
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # Step 4: Scaffold the missing configuration file if applicable
      - name: Generate Dummy config.toml
        run: |
          if [ -f config.toml.example ]; then
            cp config.toml.example config.toml
          fi

      # Step 5: Execute the build process via PlatformIO
      - name: Run PlatformIO Build
        run: pio run
