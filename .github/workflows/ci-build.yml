name: PlatformIO Firmware CI

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # A standard Linux runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Python (required for PlatformIO)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Step 3: Install the PlatformIO CLI
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # Step 4: Scaffold the missing configuration file
      # This prevents the compiler from throwing a "file not found" error
      - name: Generate Dummy config.toml
        run: cp config.toml.example config.toml

      # Step 5: Execute the build process
      - name: Run PlatformIO Build
        run: pio run