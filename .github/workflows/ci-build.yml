name: PlatformIO Firmware CI

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # A standard Linux runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Run locally
      - name: Run Pre-commit
        uses: pre-commit/action@v3.0.0

      # Step 3: Install Python (required for PlatformIO)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Step 4: Install the PlatformIO CLI
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # Step 5: Scaffold the missing configuration file
      # This prevents the compiler from throwing a "file not found" error
      - name: Generate Dummy config.toml
        run: cp config.toml.example config.toml

      # Step 6: Dynamically generate secrets.h from secure repository secrets
      - name: Generate Secrets File
        run: |
          mkdir -p include
          echo "#ifndef SECRETS_H" > include/secrets.h
          echo "#define SECRETS_H" >> include/secrets.h
          echo "#define WIFI_SSID \"${{ secrets.WIFI_SSID }}\"" >> include/secrets.h
          echo "#define WIFI_PASSWORD \"${{ secrets.WIFI_PASSWORD }}\"" >> include/secrets.h
          echo "#endif" >> include/secrets.h

      # Step 7: Execute the build process
      - name: Run PlatformIO Build
        run: pio run
