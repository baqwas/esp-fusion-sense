# ==============================================================================
# File: build_and_test.yml
# Workflow: Build & Test Matrix
# Version: 1.2.0
# Last Updated: 2026-07-30
# Purpose: Executes build and unit testing across a cross-platform environment
#          matrix to catch compatibility regressions early.
# Triggers:
#   - Pushes to main branch
#   - Pull requests targeting main branch
#
# Revision History:
#   v1.2.0 [2026-07-30] - Added concurrency control to cancel outdated PR builds.
#   v1.1.0 [2026-05-12] - Updated setup-node action to v4 and enabled npm caching.
#   v1.0.0 [2026-01-15] - Initial release with cross-platform OS & runtime matrix.
# ==============================================================================

name: Build & Test Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ------------------------------------------------------------------------------
# Concurrency Management
# Cancels any active, in-flight runs for the same branch or PR when a new commit
# is pushed, preserving GitHub Actions runner minutes.
# ------------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Version ${{ matrix.version }})
    runs-on: ${{ matrix.os }}

    # --------------------------------------------------------------------------
    # Job Strategy & Build Matrix
    # Configures execution across multiple operating systems and runtimes.
    # fail-fast: false ensures all combinations complete even if one fails.
    # --------------------------------------------------------------------------
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        version: ['18', '20']

    steps:
      # Step 1: Clone source code into the runner workspace
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Provision target runtime and enable automatic package caching
      - name: Set up environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
          cache: 'npm'

      # Step 3: Install project dependencies in clean/ci mode
      - name: Install dependencies
        run: npm ci

      # Step 4: Compile/build artifacts (if applicable)
      - name: Run build
        run: npm run build --if-present

      # Step 5: Execute test suite and report status
      - name: Execute test suite
        run: npm test
